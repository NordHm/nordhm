<!DOCTYPE html>               
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин спецодежды «Норд»</title>
<meta name="description" content="Небольшой магазин одежды: актуальные модели, описание и цены.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; color: #222; background: #fafafa; line-height: 1.5; }
  a { color: inherit; }
  header { background: #111; color: #fff; padding: 40px 20px; text-align: center; }
  header h1 { font-size: 2rem; letter-spacing: 1px; }
  header p { opacity: .8; margin-top: 8px; }
  .contacts { margin-top: 16px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .contacts a { background: #fff; color: #111; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-weight: 600; font-size: .9rem; }
  .container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
  .toolbar { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .toolbar input, .toolbar select { padding: 10px 14px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
  .toolbar input { flex: 1; min-width: 200px; }
  .categories { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .categories button { padding: 8px 16px; border: 1px solid #111; background: #fff; border-radius: 20px; cursor: pointer; font-size: .9rem; }
  .categories button.active { background: #111; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
  .card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.06); cursor: pointer; transition: transform .2s; }
  .card:hover { transform: translateY(-4px); }
  .card img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #e5e5e5; display: block; }
  .card-body { padding: 12px 14px 16px; }
  .card-title { font-weight: 600; }
  .card-price { margin-top: 6px; font-size: 1.1rem; font-weight: 700; }
  .old-price { text-decoration: line-through; color: #999; font-weight: 400; font-size: .9rem; margin-left: 6px; }
  .badge { display: inline-block; background: #e63946; color: #fff; font-size: .75rem; padding: 2px 8px; border-radius: 10px; margin-bottom: 6px; }
  .empty { text-align: center; color: #777; padding: 40px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal.open { display: flex; }
  .modal-content { background: #fff; border-radius: 12px; max-width: 800px; width: 100%; max-height: 90vh; overflow: auto; display: grid; grid-template-columns: 1fr 1fr; position: relative; }
  .modal-content img { width: 100%; height: 100%; object-fit: cover; background: #e5e5e5; }
  .modal-info { padding: 24px; }
  .modal-info h2 { margin-bottom: 8px; }
  .modal-info p { margin: 12px 0; color: #444; }
  .sizes { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0; }
  .sizes span { border: 1px solid #ccc; padding: 4px 10px; border-radius: 6px; font-size: .9rem; }
  .order-btn { display: inline-block; margin-top: 12px; background: #25d366; color: #fff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; }
  .close { position: absolute; top: 8px; right: 12px; font-size: 2rem; background: none; border: none; cursor: pointer; color: #333; }
  footer { text-align: center; padding: 30px 16px; color: #777; font-size: .9rem; }
  @media (max-width: 640px) {
    .modal-content { grid-template-columns: 1fr; }
    .modal-content img { max-height: 50vh; }
    header h1 { font-size: 1.5rem; }
  }
</style>
</head>
<body>

<header>
  <h1>Магазин «Норд»</h1>
  <p>Спецодежда в Ханты-Мансийске. ул. Дунина-Горкавича д6. · Пн-Пт 10:00–19:00 Сб-Вс 10:00–17:00</p>
  <div class="contacts">
    <a href="tel:+79991764395">+7 999 1764395</a>
    <a href="https://wa.me/79991234567" target="_blank">WhatsApp</a>
    <a href="https://t.me/your_shop" target="_blank">Telegram</a>
  </div>
</header>

<main class="container">
  <div class="toolbar">
    <input type="search" id="search" placeholder="Поиск по названию или описанию">
    <select id="sort">
      <option value="default">По умолчанию</option>
      <option value="asc">Сначала дешевле</option>
      <option value="desc">Сначала дороже</option>
    </select>
  </div>
  <div class="categories" id="categories"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>Ничего не найдено</div>
</main>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close" id="close" aria-label="Закрыть">&times;</button>
    <img id="m-img" alt="">
    <div class="modal-info">
      <h2 id="m-title"></h2>
      <div class="card-price" id="m-price"></div>
      <p id="m-desc"></p>
      <div><strong>Размеры:</strong></div>
      <div class="sizes" id="m-sizes"></div>
      <a class="order-btn" id="m-order" target="_blank">Заказать в WhatsApp</a>
    </div>
  </div>
</div>

<footer>© 2026 Магазин «Стиль». Цены на сайте не являются публичной офертой.</footer>

<script>
const SHEET_ID = "1I0o0F0eZ2-LQr6zzMDjCUtgbDYhZm0EDmMDqIZVyGQg";
const SHEET_NAME = "Лист1";   // точное имя листа внизу таблицы
const CATEGORIES = [
  "Зимняя одежда",
  "Летняя одежда",
  "Зимняя обувь",
  "Летняя обувь",
  "Аксессуары"
];

// Старые названия из таблицы приводятся к пяти разделам.
// Ключи пишите строчными буквами.
const CATEGORY_ALIASES = {
  "костюмы зимние": "Зимняя одежда",
  "костюмы демисезонные": "Зимняя одежда",   // поменяйте на "Летняя одежда", если нужно
  "куртки": "Зимняя одежда",
  "жилеты": "Зимняя одежда",
  "брюки и полукомбинезоны": "Зимняя одежда",
  "костюмы женские": "Зимняя одежда",
  "детская одежда": "Зимняя одежда",
  "зима": "Зимняя одежда",
  "лето": "Летняя одежда",
  "обувь зимняя": "Зимняя обувь",
  "обувь летняя": "Летняя обувь",
  "перчатки": "Аксессуары",
  "аксессуары": "Аксессуары"
};

function normalizeCategory(raw) {
  const key = String(raw || "").trim().toLowerCase();
  if (!key) return "Прочее";
  if (CATEGORY_ALIASES[key]) return CATEGORY_ALIASES[key];
  const exact = CATEGORIES.find(c => c.toLowerCase() === key);
  return exact || String(raw).trim();
}
const grid = document.getElementById("grid");
const empty = document.getElementById("empty");
const searchInput = document.getElementById("search");
const sortSelect = document.getElementById("sort");
const categoriesEl = document.getElementById("categories");
const modal = document.getElementById("modal");

let products = [];
let activeCategory = "Все";

const fallbackImg = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='400'><rect width='100%' height='100%' fill='%23e5e5e5'/><text x='50%' y='50%' font-size='20' text-anchor='middle' fill='%23999'>Нет фото</text></svg>";

const formatPrice = p => (Number(p) || 0).toLocaleString("ru-RU") + " ₽";

// "3 665,00" -> 3665
function toNumber(v) {
  if (v === null || v === undefined || v === "") return null;
  if (typeof v === "number") return v;
  const n = parseFloat(String(v).replace(/[^\d,.-]/g, "").replace(/\s/g, "").replace(",", "."));
  return isNaN(n) ? null : n;
}

const cellValue = c => (c && c.v !== null && c.v !== undefined ? c.v : "");

function loadFromGoogleSheets() {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(SHEET_NAME)}`;

  fetch(url)
    .then(r => {
      if (!r.ok) throw new Error("HTTP " + r.status + " — таблица не опубликована?");
      return r.text();
    })
    .then(text => {
      // срезаем обёртку google.visualization.Query.setResponse( ... );
      const start = text.indexOf("{");
      const end = text.lastIndexOf("}");
      if (start === -1) throw new Error("Неожиданный ответ Google Sheets");
      const json = JSON.parse(text.slice(start, end + 1));

      let rows = json.table.rows || [];

      // если заголовки попали в данные — убираем первую строку
      const firstTitle = String(cellValue(rows[0] && rows[0].c && rows[0].c[1])).toLowerCase();
      if (["title", "наименование", "название"].includes(firstTitle)) rows = rows.slice(1);

      products = rows.map((row, idx) => {
        const c = row.c || [];
        return {
          id: cellValue(c[0]) || idx + 1,
          title: String(cellValue(c[1])),
          category: String(cellValue(c[2])) || "Прочее",
          price: toNumber(cellValue(c[3])) || 0,
          oldPrice: toNumber(cellValue(c[4])),
          sizes: String(cellValue(c[5])).split(",").map(s => s.trim()).filter(Boolean),
          image: String(cellValue(c[6])) || fallbackImg,
          description: String(cellValue(c[7]))
        };
      }).filter(p => p.title);

      renderCategories();
      renderProducts();
    })
    .catch(err => {
      console.error("Ошибка загрузки каталога:", err);
      empty.hidden = false;
      empty.textContent = "Не удалось загрузить каталог: " + err.message;
    });
}

function priceHtml(p) {
  // показываем зачёркнутую цену только если она реально выше текущей
  const hasDiscount = p.oldPrice && p.oldPrice > p.price;
  return formatPrice(p.price) + (hasDiscount ? `<span class="old-price">${formatPrice(p.oldPrice)}</span>` : "");
}

function renderCategories() {
  const cats = ["Все", ...new Set(products.map(p => p.category))];
  categoriesEl.innerHTML = "";
  cats.forEach(cat => {
    const btn = document.createElement("button");
    btn.textContent = cat;
    if (cat === activeCategory) btn.classList.add("active");
    btn.onclick = () => { activeCategory = cat; renderCategories(); renderProducts(); };
    categoriesEl.appendChild(btn);
  });
}

function renderProducts() {
  const q = searchInput.value.trim().toLowerCase();
  let list = products.filter(p =>
    (activeCategory === "Все" || p.category === activeCategory) &&
    (p.title.toLowerCase().includes(q) || p.description.toLowerCase().includes(q))
  );
  if (sortSelect.value === "asc") list.sort((a, b) => a.price - b.price);
  if (sortSelect.value === "desc") list.sort((a, b) => b.price - a.price);

  grid.innerHTML = "";
  empty.hidden = list.length > 0;
  if (!list.length) empty.textContent = "Ничего не найдено";

  list.forEach(p => {
    const card = document.createElement("div");
    card.className = "card";
    const hasDiscount = p.oldPrice && p.oldPrice > p.price;
    card.innerHTML = `
      <img src="${p.image}" alt="${p.title}" loading="lazy" onerror="this.src='${fallbackImg}'">
      <div class="card-body">
        ${hasDiscount ? '<span class="badge">Скидка</span>' : ""}
        <div class="card-title">${p.title}</div>
        <div class="card-price">${priceHtml(p)}</div>
      </div>`;
    card.onclick = () => openModal(p);
    grid.appendChild(card);
  });
}

function openModal(p) {
  const img = document.getElementById("m-img");
  img.src = p.image;
  img.alt = p.title;
  img.onerror = () => { img.src = fallbackImg; };
  document.getElementById("m-title").textContent = p.title;
  document.getElementById("m-price").innerHTML = priceHtml(p);
  document.getElementById("m-desc").textContent = p.description;
  document.getElementById("m-sizes").innerHTML = p.sizes.map(s => `<span>${s}</span>`).join("");
  const text = `Здравствуйте! Хочу заказать: ${p.title} (арт. ${p.id}), ${formatPrice(p.price)}. Размер: `;
  document.getElementById("m-order").href = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(text)}`;
  modal.classList.add("open");
}

document.getElementById("close").onclick = () => modal.classList.remove("open");
modal.onclick = e => { if (e.target === modal) modal.classList.remove("open"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") modal.classList.remove("open"); });
searchInput.oninput = renderProducts;
sortSelect.onchange = renderProducts;

loadFromGoogleSheets();
setInterval(loadFromGoogleSheets, 300000);
</script>
</body>
</html>
